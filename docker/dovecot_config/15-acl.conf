# Shared folders (IMAP ACL), see modoboa-installer for production setups
mail_plugins = $mail_plugins acl
protocol imap {
  mail_plugins = $mail_plugins imap_acl
}

namespace shared {
  type = shared
  separator = /
  prefix = shared/%%u/
  location = sdbox:/srv/mail/%%u/Mail:INDEXPVT=~/Mail/shared/%%u
  subscriptions = no
  list = children
}

# Who shares with whom, stored in Modoboa's database (UserShare)
dict {
  acl = sqlite:/etc/dovecot/conf.d/dovecot-dict-sql.conf.ext
}
service dict {
  # The SQLite database of the dev environment belongs to root
  user = root
  # Mail processes run as vmail
  unix_listener dict {
    mode = 0600
    user = vmail
  }
}

plugin {
  acl = vfile
  acl_shared_dict = proxy::acl
}

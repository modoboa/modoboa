# Shared folders (IMAP ACL), see modoboa-installer for production setups
mail_plugins = $mail_plugins acl
protocol imap {
  mail_plugins = $mail_plugins imap_acl
}

namespace shared {
  type = shared
  separator = /
  prefix = shared/%%u/
  location = sdbox:/srv/mail/%%u/Mail:INDEXPVT=~/Mail/shared/%%u
  subscriptions = no
  list = children
}

plugin {
  acl = vfile
  # Production setups store it in Modoboa's database
  acl_shared_dict = file:/srv/mail/shared-mailboxes.db
}

name: Frontend Build

on:
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install

      # Errors fail the job; warnings are only reported. The lint was broken
      # for months (ESLint 10 ignored the old config file) without anyone
      # noticing because CI didn't run it.
      - name: Lint
        working-directory: frontend
        run: yarn lint-no-fix

      - name: Test
        working-directory: frontend
        run: yarn test

      - name: Build
        working-directory: frontend
        run: yarn build

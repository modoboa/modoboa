version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
  groups:
    python-minor-patch:
      update-types: ["minor", "patch"]
- package-ecosystem: npm
  directory: "/frontend"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    frontend-minor-patch:
      update-types: ["minor", "patch"]
